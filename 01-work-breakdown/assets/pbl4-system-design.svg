, sans-serif" font-size="14" font-weight="400" fill="#8953d5" text-anchor="middle"><tspan x="680" y="888.76">SSH 22 tới WEB → ProxyJump tới ELK → tunnel Kibana 127.0.0.1:5601</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#263445" text-anchor="middle"><tspan x="517.5" y="1094.725">PUBLIC ROUTE TABLE</tspan><tspan x="517.5" y="1114.975">10.0.0.0/16 → local</tspan><tspan x="517.5" y="1135.225">0.0.0.0/0 → Internet Gateway</tspan><tspan x="517.5" y="1155.475">EC2-WEB + NAT Gateway</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#263445" text-anchor="middle"><tspan x="1012.5" y="1094.725">PRIVATE ROUTE TABLE</tspan><tspan x="1012.5" y="1114.975">10.0.0.0/16 → local</tspan><tspan x="1012.5" y="1135.225">0.0.0.0/0 → NAT Gateway</tspan><tspan x="1012.5" y="1155.475">EC2-ELK không có public IPv4</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#263445" text-anchor="middle"><tspan x="1525" y="1086.96">SECURITY GROUPS</tspan><tspan x="1525" y="1105.8600000000001">WEB: 80/443 từ Internet; 22 từ IP nhóm /32</tspan><tspan x="1525" y="1124.76">ELK: 5044 và 22 chỉ từ pbl4-web-sg</tspan><tspan x="1525" y="1143.66">3306 / 5601 / 9200 không mở Internet</tspan><tspan x="1525" y="1162.56">NAT không nhận kết nối inbound</tspan></text></svg>